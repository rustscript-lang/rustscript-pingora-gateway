name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target

jobs:
  rust:
    name: Rust lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Policy unit tests
        run: cargo test --test gateway_policy -- --test-threads=1
      - name: Host descriptor architecture
        run: cargo test --test host_descriptor_arch -- --test-threads=1
      - name: Real Pingora proxy integration
        run: cargo test --test live_proxy -- --nocapture --test-threads=1
